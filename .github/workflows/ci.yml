name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Throwaway Postgres with the Prisma schema and synthetic data (e2e/seed.sql).
    # CI never connects to the real database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ORGANIZATION_ID: ucci-org
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      REVALIDATE_SECRET: ci-only-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Database schema + test data
        run: |
          npx prisma db push --schema=./prisma/schema.prisma --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f e2e/seed.sql

      - name: Build (standalone)
        run: |
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
